    - type: Paper
      stampState: paper_stamp-cmo
      stampedBy:
      - reapply: False
        stampType: RubberStamp
        stampedColor: '#94BAFFFF'
        stampedName: Interdyne Pharmaceutics
      content: >+
        [head=2]МАНУАЛ ПО ЗАПОЛНЕНИЮ И ИСПОЛЬЗОВАНИЮ АНЕСТЕЗИИ[/head]


        Шаг 1: Убедиться, что баллон для анестезии пустой.


        Шаг 2: Настроить выпускной клапан канистры кислорода на 700 кПа, затем заполнить баллон для анестезии; не забудьте закрыть клапан канистры, перед тем, как вынуть баллон.


        Шаг 3: Настроить выпускной клапан канистры оксида азота на 1000 кПа, затем заполнить баллон анестезии; [head=4][bold]не забудьте закрыть клапан канистры, перед тем, как вынуть баллон.[/bold][/head]


        Шаг 4: Настройте выпускной клапан баллона для анестезии на 30 кПа.


        Шаг 5: Приложите дыхательную маску к лицу пациента, поместите баллон анестезии на спину или пояс пациента, включите подачу газа.


        Пациент готов к операции.



        [head=3]ВАЖНО[/head]


        Помните, что слаймолюды не восприимчивы к усыпляющему воздействию оксида азота. В случае, если нужно провести общую анестезию слаймолюду посредством газа - используйте схожую вышеописанную схему, вместо кислорода используйте азот, а вместо оксида азота истользуйте БЗ.

        В случае, если БЗ в доступе нет, или вы собираетесь проводить операцию на лёгкие (вне зависимости от расы) - используйте хлоральгидрат, переодически добавляя дозу препарата в организм пациента по ходу операции.


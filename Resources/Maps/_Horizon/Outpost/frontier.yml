- proto: PosterContrabandAtmosiaDeclarationIndependence
  entities:
  - uid: 3709
    components:
    - type: MetaData
      desc: >-
        Часть о Воле: "Вы не можете повелевать рыцарями Атмосии. Но вы можете попросить о чём-то. Вы можете пригласить нас куда-либо. Но вы должны понимать, что беспокоите всемогущую силу, и вкладывать в просьбу соответствующие почтение и уважение. Но всегда будьте готовы к отказу, и смиренному его принятию, ибо рыцарь Атмосии сам решает, на что тратить своё драгоценное время, которого так мало выделила ему жизнь.".

        Часть о Долге: "Мы всегда придём в час Великой Нужды. Мы сбережём непосвящённых от опасностей, с которыми можем справиться только мы. Но вы должны уважать нашу силу, и не создавать эту опасность своими намерениями.".

        Часть о Славе: "Что определяет существо, как рыцаря Атмосии? Понимание о том, что всей жизни не хватит, чтобы понять все секреты нашей науки, и осознание ценности того малого количества времени, что было нам отпущено. Несломимое стремление к совершенству с пониманием, что оного не достичь. Готовность в любой момент жизни к осознанию, что наши знания ошибочны, и к переобучению в любой момент. Осознание, что далеко не все имеют и стремятся получить те знания, которые нам кажутся базовыми. Готовность идти на помощь тем, кому действительно нужна наша сила. Осознание ценности свободы, которую даёт нам Атмосия.".
    - type: Transform
      pos: 145.5,88.5
      parent: 2
    - type: Fixtures
      fixtures: {}
  - uid: 3710
    components:
    - type: MetaData
      desc: Данный документ декларирует независимость рыцарей Атмосии от тех недалёких тиранов, в частности старших инженеров, которые считают, что у них есть власть повелевать волей и временем истинных светочей атмосферной науки. На нём описаны части о Воле, Долге, и Славе.
      name: Декларация независимости Атмосии
    - type: Transform
      pos: 146.5,116.5
      parent: 2

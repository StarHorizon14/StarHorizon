# MARAUDER

- type: entity
  id: ShipMediumPlasmaProjectile
  name: plasma projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 50
        Structural: 25
        Heat: 150
#        Ion: 175
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/plasmashot.rsi
    layers:
    - state: plasmashot
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectPlasmaPulser
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#2bcc41"
    scale: 2.5
    requireNoGrid: true
    shape: triangle
  - type: TimedDespawn
    lifetime: 6.6
  - type: PointLight
    color: "#2bff00"
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DefaultShipGun
    totalIntensity: 25
    intensitySlope: 5
    maxIntensity: 15
    maxTileBreak: 1


- type: entity
  parent: BaseRailing
  id: HorizonBaseRailing
  abstract: true
  name: WoodenRailing
  description: Basic wooden railing meant to protect idiots like you from falling.
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Horizon/Structures/Walls/corner.rsi
  - type: Icon
    sprite: _Horizon/Structures/Walls/corner.rsi

- type: entity
  parent: HorizonBaseRailing
  id: WoodenRailing
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Horizon/Structures/Walls/corner.rsi
    state: side
  - type: Icon
    sprite: _Horizon/Structures/Walls/corner.rsi
    state: side
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.25"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    node: WoodenRailing


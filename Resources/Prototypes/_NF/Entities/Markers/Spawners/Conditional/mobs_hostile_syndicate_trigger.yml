- type: entity
  name: syndicate naval captain spawner
  id: SpawnMobSyndicateNavalCaptainTrigger
  parent: MarkerBase
  suffix: AI, Hostile, Trigger
  components:
  - type: Sprite
    layers:
      - state: red
      - state: ai
      - sprite: _NF/Mobs/Species/Templates/human.rsi
        state: human
      - sprite: Clothing/Head/Hats/syndiecap_maa.rsi
        state: equipped-HELMET
      - sprite: Clothing/Uniforms/Jumpsuit/tacticool.rsi
        state: equipped-INNERCLOTHING
      - sprite: Clothing/Shoes/Boots/jackboots.rsi
        state: equipped-FEET
      - sprite: Clothing/OuterClothing/Coats/syndicate/coatsyndiecaparmored.rsi
        state: equipped-OUTERCLOTHING
      - sprite: Objects/Weapons/Guns/Revolvers/python.rsi
        state: inhand-left
      - sprite: _NF/Objects/Weapons/Melee/armingsword.rsi
        state: inhand-right
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: AutoLinkReceiver
    channel: SyndicateNavalTrigger
  - type: SpawnOnTrigger
    proto: MobSyndicateNavalCaptainB
  - type: DeleteOnTrigger


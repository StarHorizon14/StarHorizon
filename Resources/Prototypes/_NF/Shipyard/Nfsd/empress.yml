- type: vessel
  id: Empress
  parent: BaseVessel
  name: NSF Empress
  # Horizon
  description: Большой патрульный материнский флагман, способный вмещать до четырех скоростных боевых единиц в своих стыковочных портах.
  price: 170000 #Appraisal value is 150000
  category: Large
  group: Security
  access: Bailiff
  shuttlePath: /Maps/_NF/Shuttles/Nfsd/empress.yml

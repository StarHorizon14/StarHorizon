- type: entity
  name: GX Преторианец
  parent: [BaseWeaponPistol, BaseC3Contraband]
  id: WeaponRifleGSecPraetor
  description: Штурмовая винтовка с загаточной историей, обладает ужасной репутацией «Оружия военных преступлений».Не имеет серийной маркировкой. Дорогой, но надёжный.
  suffix: GSec, AnCo
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/gsec-praetor.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/gsec-praetor.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Back
  - type: Item
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/gsec-praetor.rsi
    size: Large
    shape:
    - 0,0,3,2
  - type: Gun
    minAngle: 10
    maxAngle: 30
    projectileSpeed: 40
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/c-20r.ogg
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleGSecPraetor
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - AnCoMagazineRifle30
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BaseCartridgeRifleAnCoBuff
        priority: 1
        whitelist:
          tags:
            - AnCoBulletRifle20
            - AnCoBulletRifle30
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: NFWeaponDetails
    class: weapon-details-class-assault-rifle
    manufacturer: "AnCo - MiliGalax"
  - type: StaticPrice
    price: 30000

- type: entity
  name: GXS-50 Депредатор
  parent: [BaseWeaponPistol, NFBaseGunMeleeAttackMedium, BaseAttachableHolder, BaseGSecWeaponContraband]
  id: WeaponRifleGSecDepredator
  suffix: GSec, Снайперская винтовка
  description: Разрушительная боевая винтовка, способная проглотить любой калибр достаточного размер. Может использовать большинство снайперских патронов и идеально подходит для обороны частной собственности.
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/Depredator/gsec-depredator-big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/Depredator/gsec-depredator.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Back
  - type: Item
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/Depredator/gsec-depredator.rsi
    size: Large
    shape:
    - 0,0,5,2
  - type: Gun
    cameraRecoilScalar: 100
    soundGunshot:
      path: /Audio/Weapons/Guns64/Snipers/tl127.ogg
      params:
        volume: -5
    soundEmpty:
      path: /Audio/Weapons/Guns64/Rifles/m41a_empty.ogg
    projectileSpeed: 70
    minAngle: 0.4
    maxAngle: 7
    angleIncrease: 5.6
    angleDecay: 2.7
    fireRate: 1.5
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns64/Snipers/tl-127_bolt.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineSniperGSec
        insertSound: /Audio/Weapons/Guns64/Rifles/m41a_reload.ogg
        ejectSound: /Audio/Weapons/Guns64/Rifles/m41a_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineSniperGSec
      gun_chamber:
        name: Chamber
        startingItem: Cartridge50BMG
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle762UEG
          - CartridgeRifle300win
          - CartridgeRifle762
          - CartridgeRifle50BMG
          - NFCartridgeRifle60
          - Cartridge70
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 1
  - type: NFWeaponDetails
    class: weapon-details-class-rifle
    manufacturer: weapon-details-manufacturer-gorlex-steel-works
  - type: SpeedModifiedOnWield
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - AttachmentMagneticHarness
          - AttachmentReflexSight
          - AttachmentT2Miniscope
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.12975, 0.0025


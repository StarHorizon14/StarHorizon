- type: entity # folded turret
  id: GSecWeaponTurretPacked
  name: упакованная турель Горлекс
  description: Упакованая турель ЧВК «Gorlex Securities LLC».
  suffix: GSec
  parent: [BaseGSecContraband, BaseItem]
  components:
  - type: WeaponCaseInsertable
  - type: MultiHandedItem
  - type: SpawnAfterInteract
    prototype: GSecWeaponTurret
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/magazinefed.rsi
    state: packed
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/magazinefed.rsi
  - type: StaticPrice
    price: 20000

- type: entity # deployed turret
  id: GSecWeaponTurret
  name: баллистическая турель Горлекс
  description: Автономная Защитная Турель ЧВК «Gorlex Securities LLC». Не стойте рядом, пока она работает.
  suffix: GSec
  parent: [BaseGSecContraband, BaseWeaponTurretMagazineFed]
  components:
  - type: NPCImprintingOnSpawnBehaviour
    whitelist:
      components:
      - HumanoidAppearance
  - type: NpcFactionMember
    factions:
    - GSec
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Guns/magazinefed.rsi
    drawdepth: Mobs
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineUniversalGSec
  - type: Construction
    deconstructionTarget: null
    graph: GSecWeaponTurretPackingGraph
    node: GSecWeaponTurretPacked


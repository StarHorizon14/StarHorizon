  description: Универсальный короб для боеприпасов разработанный по заказу ЧВК «Gorlex Securities LLC».
  suffix: GSec, empty
  components:
  - type: Tag
    tags:
      - MagazineUniversalGSec
  - type: Item
    size: Normal
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Ammo/Magazine/box_mag_universal.rsi
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - ShellShotgun
        - NFCartridgePistol35
        - NFCartridgePistol45
        - NFCartridgeRifle20
        - NFCartridgeRifle30
        - NFCartridgeRifle60
        - AnCoBulletSniper70

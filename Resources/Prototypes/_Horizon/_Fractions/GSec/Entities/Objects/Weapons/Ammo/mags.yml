- type: entity
  id: MagazineSniperGSec
  name: крупнокалиберный магазин Горлекс
  description: Разработанный Cybersun магазин для подачи множества калибров высокой убойной силы.
  suffix: GSec
  parent: BaseItem
  components:
  - type: Tag
    tags:
      - MagazineSniperGSec
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 7
    proto: Cartridge50BMG
    whitelist:
      tags:
        - CartridgeRifle762UEG
        - CartridgeRifle300win
        - CartridgeRifle762
        - CartridgeRifle50BMG
        - NFCartridgeRifle60
        - Cartridge70
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Ammo/Magazine/sniper-mag-gsec.rsi
    size: Small
    shape:
    - 0,0,1,1
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: Sprite
    netsync: false
    sprite: _Horizon/_Fractions/GSec/Objects/Weapons/Ammo/Magazine/sniper-mag-gsec.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-2
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance


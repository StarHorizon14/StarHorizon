- type: entity
  name: флиппо Горлекс
  parent: FlippoLighter
  id: FlippoGSecLighter
  suffix: GSec
  description: "Трофейная зажигалка сделанная по заказу ЧВК «Gorlex Securities LLC»."
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Tools/Lighters/gsec-lighter.rsi
    layers:
    - state: icon
      map: ["base"]
    - state: top
      map: ["top"]
      visible: false
    - state: open
      map: ["open"]
      visible: false
    - state: flame
      map: ["flame"]
      visible: false
      shader: unshaded
  - type: ItemToggleMeleeWeapon
    activatedDamage:
        types:
            Heat: 3
  - type: Welder
    fuelConsumption: 0.005
    fuelLitCost: 0.01
    tankSafe: true
  - type: StealTarget
    stealGroup: FlippoGSecLighter
  - type: StaticPrice
    price: 700


- type: entity
  name: медицинский подсумок Горлекс
  id: PouchGSecMedical
  suffix: GSec
  parent: [ MedicalPouch, BaseGSecContraband]
  description: Подсумок для медикоментов, вмещает 15 маленьких предметов.
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Storage/Pouches/pouch_medic.rsi
    layers:
    - state: base
    - state: closed
      map: [ "closeLayer" ]
    - state: open
      map: [ "openLayer" ]
      visible: false
    - state: inside
      map: ["insideLayer"]
      visible: false
    - state: fill-chem-1
      map: [ "pouchFill1" ]
      visible: false
    - state: fill-chem-2
      map: [ "pouchFill2" ]
      visible: false
    - state: fill-chem-3
      map: [ "pouchFill3" ]
      visible: false
    - state: fill-chem-4
      map: [ "pouchFill4" ]
      visible: false
  - type: Clothing
    sprite: _Horizon/_Fractions/GSec/Objects/Storage/Pouches/pouch_medic.rsi
    clothingVisuals:
      belt:
      - state: equipped-BELT
        color: "#3e3e48"
      pocket:
      - state: equipped-BELT
        color: "#3e3e48"
  - type: Item
    size: Small
    sprite: _Horizon/_Fractions/GSec/Objects/Storage/Pouches/pouch_medic.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#3e3e48"
      right:
      - state: inhand-right
        color: "#3e3e48"
  - type: Storage
    grid:
    - 0,0,4,2

# ТЕРМИНАЛ ЗАКАЗОВ GSEC
# ================================================================================================================================

- type: entity
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseComputer, StorePresetGSecUplink]
  id: ComputerGSecUplink
  name: консоль заказов Горлекс
  description: Используется для пополнения ассортимента и вооружения персонала.
  suffix: GSec, Structure
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: ActiveRadio
    channels: [ GSec ]
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#2C5799"
  - type: AnCoFactionAccess
    allowedFactions:
    - FactionGSec
    - FactionSyndicate
    unlockAccess: AccessGSecOfficer
    deniedMessage: "gsec-faction-access-denied"
    examinedEvent: "gsec-faction-access-denied"


  id: GSecVendingClothing
  name: ОдеждоМат Горлекс
  description: Вендор с одеждой ЧВК «Gorlex Securities LLC». Содержит всё, для комфорта в суровых условиях.
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Structures/Machines/VendingMachines/clothing.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel

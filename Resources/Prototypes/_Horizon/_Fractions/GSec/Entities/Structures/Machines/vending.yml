- type: entity
  parent: [VendingMachine, BaseGSecContraband]
  suffix: GSec, Structure
  categories: [HideSpawnMenu]
  id: GSecVending
  abstract: true
  components:
  - type: VendingMachine
    pack: null
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
  - type: DatasetVocalizer
    dataset: GSecClothesMateAds
  - type: MarketModifier
    mod: 5
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Speech
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Structures/Machines/VendingMachines/clothing.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.8
    energy: 1.6
    color: "#2C5799"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
            spawn:
              SheetSteel1:
                min: 1
                max: 5
              ShardGlass:
                min: 1
                max: 3
  - type: StaticPrice
    price: 6000

- type: entity

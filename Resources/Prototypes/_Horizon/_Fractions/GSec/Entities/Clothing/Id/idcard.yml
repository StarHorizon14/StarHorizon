  id: GSecIDCard
  name: GSecID
  abstract: true
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Objects/Misc/idcard.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: _Horizon/_Fractions/GSec/Objects/Misc/idcard.rsi
  - type: Item
    size: Small


- type: entity
  parent: ClothingNeckBase
  id: ClothingCloakGSec
  suffix: GSec
  name: плащ Горлекс
  description: Стильный плащ в цвете оливы, сделан на совесть.
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/GSec/Clothing/Neck/Cloacks/cloack.rsi
  - type: StaminaResistance # do not add these to other equipment or mobs, we don't want to microbalance these everywhere
    damageCoefficient: 0.98
  - type: ExplosionResistance
    damageCoefficient: 0.97
  - type: Armor
    modifiers:
      coefficients:
        Piercing: 0.97
        Heat: 0.95
        Caustic: 0.95
  - type: StaticPrice
    price: 600



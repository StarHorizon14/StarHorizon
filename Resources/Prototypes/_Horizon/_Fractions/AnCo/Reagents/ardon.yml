- type: reagent
  id: Ardon
  name: Ардон
  group: Narcotics
  desc: Горячий, вязкий словно ардоновая лава, погодите, она и есть.
  physicalDesc: Горячая
  flavor: metallic
  color: "#f05a5a"
  worksOnTheDead: true
  metamorphicSprite:
    sprite: _Horizon/_Fractions/AnCo/Objects/Food/ardonwater.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false

- type: entity
  id: PottedPlantAnCoBase
  parent: BaseStructureDynamic
  name: пустой горшок для растений
  description: Крутой горшок из казмия
  abstract: true
  components:
  - type: SpriteFade
  - type: Transform
    noRot: true
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
        density: 190
        mask:
        - HighImpassable
  - type: Sprite
    drawdepth: Overdoors
    offset: "0.0,0.3"
    sprite: Structures/Furniture/potted_plants.rsi
    noRot: true
  - type: Speech
    speechVerb: Plant # for pais (In the secret stash)
  - type: Pullable
  - type: StaticPrice
    price: 50
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}

- type: entity
  parent: [BaseAnCoContraband, PottedPlantAnCoBase, ClothingHeadBase]
  id: PottedEmpty
  suffix: StarHorizon, AnCo
  name: пустой горшок
  description: Крутой горшок из казмия
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Structures/Decoration/plant.rsi
    layers:
    - state: empty
  - type: Construction
    graph: AnCoPlantSeed
    node: donecraft
  - type: Item
    size: Normal
  - type: DisableToolUse
    anchoring: true

- type: entity
  parent: [BaseAnCoContraband, PottedPlantAnCoBase]

- type: entity
  id: BasePlantAnCo
  description: Красные растения, о боже!
  abstract: true
  components:
  - type: InteractionOutline
  - type: SpriteFade
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _Horizon/_Fractions/AnCo/Structures/flora.rsi
    drawdepth: Overdoors
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/slash.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Weapons/slash.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      # - !type:SpawnEntitiesBehavior
      #   spawn:
      #     Log:
      #       min: 2
      #       max: 8
  - type: PointLight
    radius: 3
    energy: 3
    color: "#cc0000"

- type: entity
  id: PlantAnCoGrass
  parent: BasePlantAnCo
  suffix: StarHorizon, AnCo, Flora
  name: трава ардониевой пустоши
  components:
  - type: Sprite
    noRot: true
    sprite: _Horizon/_Fractions/AnCo/Structures/flora.rsi
    layers:
    - state: grass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Weapons/slash.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          AnCoSeedGrass:
            min: 0
            max: 1


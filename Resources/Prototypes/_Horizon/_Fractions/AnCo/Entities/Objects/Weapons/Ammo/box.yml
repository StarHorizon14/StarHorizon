- type: entity
  parent: [BaseItem, BaseAnCoContraband]
  id: AnCoMagazineBoxBase
  name: короб боеприпасов
  categories: [ HideSpawnMenu ]
  suffix: StarHorizon, AnCo
  components:
  - type: Item
    size: Normal
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Ammo/Magazine/box_mag.rsi
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - AnCoBulletShotgun50
        - AnCoBulletPistol35
        - AnCoBulletRifle20
        - AnCoBulletRifle30
        - AnCoBulletSniper70
    capacity: 120
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Ammo/Magazine/box_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 11
    zeroVisible: false
  - type: Appearance


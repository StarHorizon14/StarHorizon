      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Ammo/Magazine/box_mag_universal.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 11
    zeroVisible: false
  - type: Appearance


  name: универсальный короб боеприпасов
  description: Универсальный короб для боеприпасов, способных хранить боеприпасы АнКо
  suffix: StarHorizon, AnCo, empty
  components:
  - type: Tag
    tags:
      - MagazineAsmgtAnCo
  - type: Item
    size: Normal
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Ammo/Magazine/box_mag_universal.rsi
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - AnCoBulletShotgun50
        - AnCoBulletPistol35
        - AnCoBulletRifle20
        - AnCoBulletRifle30
        - AnCoBulletSniper70

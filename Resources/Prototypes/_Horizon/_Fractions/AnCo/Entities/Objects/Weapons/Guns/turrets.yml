- type: entity # folded turret
  id: AnCoWeaponTurretGuardianPacked
  name: упакованный АЗТ Страж
  description: Упакованая турель корпорации АнКо.
  suffix: StarHorizon, AnCo
  parent:
  - BaseAnCoContraband
  - BaseItem
  components:
  - type: WeaponCaseInsertable
  - type: MultiHandedItem
  - type: SpawnAfterInteract
    prototype: AnCoWeaponTurretGuardian
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Guns/magazinefed.rsi
    state: packed
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Guns/magazinefed.rsi

- type: entity # deployed turret
  id: AnCoWeaponTurretGuardian
  name: АЗТ Страж
  description: Автономная Защитная Турель корпорации АнКо, защищает даже когда все мертвы.
  suffix: StarHorizon, AnCo
  parent:
  - BaseAnCoContraband
  - BaseWeaponTurretMagazineFed
  components:
  - type: NPCImprintingOnSpawnBehaviour
    whitelist:
      components:
      - HumanoidAppearance
  - type: NpcFactionMember
    factions:
    - AnCoSecurBot
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Guns/magazinefed.rsi
    drawdepth: Mobs
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineAsmgtAnCo
  - type: Construction
    deconstructionTarget: null
    graph: AnCoWeaponTurretGuardianPackingGraph
    node: AnCoWeaponTurretGuardianPacked


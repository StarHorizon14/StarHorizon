  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Grenades/bot-grenade.rsi
  - type: SpawnOnTrigger
    keysIn:
    - timer
    predicted: true
    proto: AnCoDrone
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"

- type: entity
  parent: [ProjectileGrenadeBase, BaseTKAnCoContraband]
  id: GrenadeStingerAnCoTarget
  suffix: StarHorizon, AnCo
  name: кластерная граната
  description: Она делает бум, и еще бабах, и даже наводится. Но на всех.
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Grenades/cluster-grenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ProjectileGrenade
    fillPrototype: StandartBallisticAnCoShotgun # Frontier: use NF variant
    capacity: 30
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: "/Audio/Effects/flash_bang.ogg"
    positional: true
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: GrenadeFlashEffect
    predicted: true
  - type: TriggerOnUse
  - type: TimerTrigger
    initialBeepDelay: 0
    beepInterval: 2
    delay: 3.5
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/countdown.ogg
  - type: AnCoGunAutoTarget

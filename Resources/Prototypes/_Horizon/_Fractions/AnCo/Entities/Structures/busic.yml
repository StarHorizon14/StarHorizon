- type: entity
  id: BaseBusik
  name: 'ГЛТ "Корова"'
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: Transform
    noRot: false
  - type: Clickable
  - type: HandheldGPS
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.7,-0.7,0.7,0.7"
        density: 100
        mask:
          - MobMask
        layer:
          - MobLayer
        hard: true
  - type: Pullable
  - type: RadarBlip
    scale: 4
    shape: Square
    visibleFromOtherGrids: true
    requireNoGrid: true
    radarColor: "#F05A5AFF"
    highlightedRadarColor: "#FF4500FF"
  - type: RadiationBlockingContainer
    radResistance: 4
  - type: Reflect
    reflects:
    - Energy
    reflectProb: 0.2
    spread: 90
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
    netsync: false
  - type: MovementSpeedModifier
    baseSprintSpeed: 8
    baseWalkSpeed: 4
    baseAcceleration: 2
    baseFriction: 0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 700
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 800 # Пластитановая стена
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
          spawn:
            KazmieSheet:
              min: 1
              max: 10
            ArdonSheet:
              min: 1
              max: 5
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 30
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Mobs/busic.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: close
      map: ["enum.StorageVisualLayers.Door"]
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: base
    stateDoorOpen: open
    stateDoorClosed: close
  - type: RadarConsole
    maxRange: 256
    maxIffRange: null
    followEntity: true
    hideCoords: false
  - type: CrewMonitoringConsole
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
      enum.CrewMonitoringUIKey.Key:
        toggleAction: ActionAGhostShowCrewMonitoring
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: InputMover
  # - type: CanMoveInAir
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: InteractionOutline
  - type: NoSlip
  - type: ComplexInteraction
  - type: Examiner
  - type: Puller
    needsHands: false
  - type: DamageOnHighSpeedImpact
    damageCooldown: 2
    minimumSpeed: 8
    damage:
      types:
        Blunt: 50
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 30
  - type: EntityStorage
    isCollidableWhenOpen: false
    openOnMove: false
    airtight: true
    capacity: 6
  - type: Tag
    tags:
      - DoorBumpOpener

- type: entity
  id: RemoteBusik
  parent: BaseBusik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, встроеная удалёнка
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: EntityStorage
    isCollidableWhenOpen: false
    openOnMove: false
    airtight: true
    capacity: 8
  - type: JumpAbility
    jumpDistance: 150
    jumpThrowSpeed: 30
    jumpSound: /Audio/Effects/stealthoff.ogg
    canCollide: true
  - type: ActionGrant
    actions:
      # - ActionHorn
      # - ActionActivateEmpImplant
      # - ActionGravityJump
      # - ActionToggleJetpack
      - ActionEMPStandartExplodesAnCo
      - ActionSmoke
  - type: CanBeTakenUnderControl
  - type: RemoteControlMonitor
    isPowered: true

- type: entity
  id: StorageBusik
  parent: BaseBusik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, встроеное хранилище
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: EntityStorage
    isCollidableWhenOpen: false
    openOnMove: false
    airtight: true
    capacity: 6
  - type: JumpAbility
    jumpDistance: 150
    jumpThrowSpeed: 30
    canCollide: true
  - type: ActionGrant
    actions:
      # - ActionGravityJump
      - ActionEMPStandartExplodesAnCo
      - ActionSmoke
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
      Shuttle: !type:ContainerSlot
      Shuttle2: !type:ContainerSlot
  - type: ItemSlots
    slots:
      Shuttle:
        priority: 1
        insertVerbText: Прикрепить к креплению челнока
        ejectVerbText: Открепить с крепления шаттла
        name: крепление
        swap: false
        insertOnInteract: false
        whitelist:
          components:
          - Item
      Shuttle2:
        priority: 2
        insertVerbText: Прикрепить к креплению челнока
        ejectVerbText: Открепить с крепления шаттла
        name: Крепление
        swap: false
        insertOnInteract: false
        whitelist:
          components:
          - Item
  - type: CanBeTakenUnderControl
  - type: Storage
    clickInsert: false
    openOnActivate: false
    grid:
    - 0,0,38,25
    maxItemSize: Ginormous
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface

- type: entity
  id: CardboardBusik
  parent: BaseBusik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, картоная коробка
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: CardboardBox
    effectSound: /Audio/Effects/chime.ogg
    quiet: true
  - type: EntityStorage
    isCollidableWhenOpen: false
    openOnMove: false
    airtight: true
    capacity: 8

- type: entity
  id: StorageCanisterBusik
  parent: StorageBusik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, хранилище, кислород
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: EntityStorage
    isCollidableWhenOpen: false
    openOnMove: false
    airtight: true
    capacity: 4
  - type: ActivatableUI
    key: enum.GasCanisterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasCanisterUiKey.Key:
        type: GasCanisterBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: ContainerContainer
    containers:
      tank_slot: !type:ContainerSlot
      entity_storage: !type:Container
      Shuttle: !type:ContainerSlot
  - type: GasCanister
    gasMixture:
      volume: 1500
      moles:
      - 2769.36 # oxygen
      temperature: 293.15
    gasTankSlot:
      name: comp-gas-canister-slot-name-gas-tank
      ejectOnBreak: true
      whitelist:
        components:
          - GasTank
  - type: NodeContainer
    nodes:
      port:
        !type:PortablePipeNode
        nodeGroupID: Pipe
        rotationsEnabled: false
        volume: 1
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: ItemSlots
    slots:
      Shuttle:
        priority: 1
        insertVerbText: Прикрепить к креплению челнока
        ejectVerbText: Открепить с крепления шаттла
        name: крепление
        swap: false
        insertOnInteract: false
        whitelist:
          components:
          - Item

- type: entity
  id: StorageCanisterV2Busik
  parent: StorageBusik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, хранилище, кислород V2

- type: entity
  parent: [ GasCanister, BaseC3WizardContraband ]
  id: ItemWizardGasCanisterBottomlessOxygen
  name: Бедонная канистра
  suffix: Полная, кислород, item
  description: 'Баллон, который может вмещать больше газа, чем предполагает его размер. С любовью изготовлен для коммерческого использования брендом "Бездонный".'
  components:
  - type: Sprite
    sprite: _NF/Structures/Specific/Wizard/canister.rsi
    layers:
      - state: oxygen
        shader: unshaded
      - state: canister
  - type: GasCanister
    gasMixture:
      volume: 15000 # 1500[base canister volume] * 10
      moles: # List of gasses for easy reference
        - 18717.1051 # oxygen
        - 0 # nitrogen
        - 0 # CO2
        - 0 # Plasma
        - 0 # Tritium
        - 0 # Water vapor
        - 0 # Ammonia
        - 0 # N2O
        - 0 # Frezon
      temperature: 293.15
  - type: StaticPrice
    price: 1250
  - type: Item
    size: Ginormous
    shape:
    - 0,0,12,12
  - type: AnCoWeaponWeight
    weight: 3

- type: entity
  parent: [BaseItem, RecyclableItemDeviceSmall]
  id: HandheldRemoteControllerMonitor
  name: монитор удаленного управления
  description: Позволяет установить связь с подключенным существом.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
      - state: tablet
      - sprite: _NF/Objects/Devices/tablets.rsi
        state: cameras
        shader: unshaded
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: RemoteControlMonitor
    isPowered: true

- type: entity
  parent: BaseAction
  id: ActionEMPStandartExplodesAnCo
  name: Ракета
  description: Выпускает взрывную ЕМП ракету по клику
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    raiseOnUser: true
    icon:
      sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/Guns/Projectiles/proj.rsi
      state: Rocket
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: EMPStandartExplodesAnCo

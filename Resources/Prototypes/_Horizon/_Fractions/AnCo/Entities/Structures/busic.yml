- type: entity
  id: StorageCanisterV2BusikLock
  parent: StorageCanisterV2Busik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, хранилище, кислород V2, закрыт
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: Lock
    locked: true
  - type: LockedStorage
  - type: AccessReader
    access: [[ "AccessAnCoWelcome" ]]

- type: entity
  id: MechBusik
  parent: StorageCanisterV2Busik
  name: 'ГЛТ "Корова"'
  suffix: AnroxComputer, кислород V2, хранилище, мех
  description: Грузовой Летательный Транспорт корпорации AnroxComputers. Обычно служащий для поимки клаустрафобов для последующего подписания контракта.
  components:
  - type: EntityStorage
    isCollidableWhenOpen: false
    openOnMove: false
    airtight: true
    capacity: 3
  - type: CanBeTakenUnderControl
    remotePilot: MobRemotePilot
  - type: Mech
    airtight: true
    maxEquipmentAmount: 2
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.6
        Radiation: 0
        Caustic: 0.9
        Structural: 0.5
    equipmentWhitelist:
      tags:
      - MechEquipmentGeneral
      - MechEquipmentClown
      - MechEquipmentMed
      - MechEquipmentSecCC
      - MechEquipmentSecProt
      - MechEquipmentSecMissile
      - MechEquipmentSecLKinetic
      - MechEquipmentSecHKinetic
      - MechEquipmentSecLLazer
      - MechEquipmentSecHLazer
      - MechEquipmentSecExperim
      - MechEquipmentMining
    mechToPilotDamageMultiplier: 0.2
    pilotWhitelist:
      components:
        - HumanoidAppearance
  - type: MechAir
  - type: AirFilter
    gases:
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    overflowGases:
    - Nitrogen
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
  - type: AirIntake
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
      enum.MechUiKey.Key:
        type: MechBoundUserInterface
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
      Shuttle: !type:ContainerSlot
      Shuttle2: !type:ContainerSlot
      mech-pilot-slot: !type:ContainerSlot
      mech-equipment-container: !type:Container
      mech-battery-slot: !type:ContainerSlot
      storagebase: !type:Container
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCellHigh
      storagebase:
      - ItemWizardGasCanisterBottomlessOxygen



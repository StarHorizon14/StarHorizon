- type: entity
  id: AnCoTurretFlash
  name: УБТ Вспышка
  parent: [BallisticArtillery, BaseAnCoContraband]
  suffix: StarHorizon, AnCo
  description: Управляемая Боевая Турель, способная выплескивать энергетический заряд способный перегрузить электорнику противника.
  components:
  - type: StaticPrice
    price: 3500
  - type: Sprite
    sprite: _Horizon/_Fractions/AnCo/Objects/Weapons/ShuttleWeapon/flash.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: FireControlRotate
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.3
    projectileSpeed: 90
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon2.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 350
  - type: SpaceArtillery
    powerChargeRate: 350
    powerUsePassive: 1250
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipAnCoEMP
    fireCost: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RadarBlip
    radarColor: "#b30e0e"
    scale: 2
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Medium


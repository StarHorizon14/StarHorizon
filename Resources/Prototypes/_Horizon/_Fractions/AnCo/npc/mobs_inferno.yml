- type: entity
  name: спавнер фауны АнКо
  id: SpawnAnCoFaunaRandom
  parent: MarkerBasePlaceFree
  suffix: StarHorizon, AnCo, Dungeon
  components:
  - type: Sprite
    layers:
      - state: green
        scale: 0.7, 0.7
      - sprite: _Horizon/_Fractions/AnCo/Mobs/fauna.rsi
        state: spider
  - type: RandomSpawner
    prototypes:
      - AnCoFaunaSpiderInferno
      - AnCoFaunaTonkInferno
      - AnCoFaunaSliceInferno
      - AnCoFaunaPicaInferno
      - AnCoFaunaMouseInferno
      - AnCoFaunaFlyerInferno
    chance: 1
    offset: 0.0
- type: entity
  id: BaseAnCoIfterno
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
      - DoorBumpOpener
  - type: NpcFactionMember
    factions:
      - SimpleHostile
  - type: HTN
    rootTask:
       task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      VisionRadius: !type:Single
        20
      AggroVisionRadius: !type:Single
        20
      FollowRange: !type:Single
        20
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        3.0
  - type: Tool
    speedModifier: 5.0
    qualities:
      - Prying
    hideQualities: true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 5.0

- type: entity
  parent: [AnCoDroneDungeon, BaseAnCoIfterno]
  id: AnCoCrabInferno
  name: защитный бот АнКо
  suffix: Inferno
  categories: [ HideSpawnMenu ]
  components:
  - type: HTN
    rootTask:
       task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool
        false
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      SoundTargetInLOS: !type:SoundPathSpecifier

# ==========================================
# 2. ТЕРМИНАЛ ЗАКАЗОВ LVHI
# ==========================================
- type: entity
  parent: [BaseItem, StorePresetUplink]
  id: LVHIUplinkRadio
  name: "Терминал заказов LVHI"
  description: "Портативный планшет связи с отделом снабжения Langstad-Voigt. Принимает кристаллизованные алмазы и спесо."
  suffix: LVHI
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/LVHI/Entities/Objects/Specific/LVHIUplink.rsi
    state: qm_clipboard
  - type: Item
    sprite: _Horizon/_Fractions/LVHI/Entities/Objects/Specific/LVHIUplink.rsi
    size: Tiny
  - type: Clothing
    sprite: _Horizon/_Fractions/LVHI/Entities/Objects/Specific/LVHIUplink.rsi
    slots:
    - belt
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    canWithdraw: true
    currencyWhitelist:
    - LVHICrystal
    - Speso
    balance:
      LVHICrystal: 0
      Speso: 0
    categories:
    - LVHIUplinkHardsuits
    - LVHIUplinkMining
    - LVHIUplinkDrilling
    - LVHIUplinkMedical
    - LVHIUplinkSpesoCrystal


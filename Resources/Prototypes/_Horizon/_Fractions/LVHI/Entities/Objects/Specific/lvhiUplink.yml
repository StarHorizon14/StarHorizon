    sprite: _Horizon/_Fractions/LVHI/Entities/Objects/Specific/LVHIDiamondCrystal.rsi
    state: telecrystal
  - type: Item
    sprite: _Horizon/_Fractions/LVHI/Entities/Objects/Specific/LVHIDiamondCrystal.rsi
    size: Tiny
  - type: Stack
    count: 20
    stackType: LVHIDiamondCrystal
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 200
  - type: Currency
    price:
      LVHICrystal: 1


- type: entity
  save: false
  name: Урист МакАстартес
  parent: BaseMobHuman
  id: MobHumanAstartes
  components:
  # Horizon
  - type: SampleSource
    availableCellSamples:
    - protoID: CellSampleHuman
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 4000
      behaviors:
      - !type:GibBehavior { }
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Critical
      400: Dead
  - type: Sprite
    scale: 1.225, 1.225
  - type: Oni
    modifiers:
      coefficients:
        Blunt: 2
        Slash: 2
        Piercing: 2
        Heat: 2
  - type: PassiveDamage 
    allowedStates:
    - Alive
    damageCap: 299
    damage:
      types:
        Heat: -0.1
        Shock: -0.1
        Cold: -0.1
      groups:
        Brute: -0.3
  - type: Body
    prototype: Astartes
    requiredLegs: 2
  - type: SlowOnDamage
    speedModifierThresholds:
      75: 0.95
      100: 0.9
      150: 0.8
      200: 0.6
      250: 0.5
  - type: TemperatureSpeed
    thresholds:
      293: 0.95
      280: 0.9
      260: 0.85
  - type: StaminaResistance # do not add these to other equipment or mobs, we don't want to microbalance these everywhere
    damageCoefficient: 0.2


- type: body
  id: Astartes
  name: "astartes"
  root: torso
  slots:
    head:
      part: HeadHuman
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        tongue: OrganHumanTongue
        eye_implant: null # Horizon
        cyberdeka_implant: null # Horizon
    torso:
      part: TorsoHuman
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        heart: OrganBsHeart
        lungs: OrganBsLungs
        stomach: OrganBsStomach
        liver: OrganBsLiver
        kidneys: OrganBsKidneys
        vessels_implant: VesselsImplant
        blood_pump_implant: BloodPumpImplant
        skin_implant: UpgradedSubcutaneousArmor
        bone_implant: BoneHeavyImplant
        cavity: null # Horizon
    right arm:
      part: RightArmHuman
      connections:
      - right hand
    left arm:
      part: LeftArmHuman
      connections:
      - left hand

    right hand:
      part: RightHandHuman
      organs:
        hands_implant: null # _Horizon
    left hand:
      part: LeftHandHuman
      organs:
        hands_implant: null # _Horizon

    right leg:
      part: RightLegHuman
      connections:
      - right foot
    left leg:
      part: LeftLegHuman
      connections:
      - left foot
    right foot:
      part: RightFootHuman
    left foot:
      part: LeftFootHuman

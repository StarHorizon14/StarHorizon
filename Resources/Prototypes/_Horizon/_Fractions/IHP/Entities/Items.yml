- type: entity 
  id: WeaponTurretAsmgtNtPackedIHP
  name: Сложенная XE-АБС
  description: |-
   Автоматическая Баллистическая Система - комплексная турель предназначенная для поражения лёгких и средних целей, разработанна специально для Забвения, но это не мешает ей выполнять и прочие задания.
  suffix: IHP 
  parent:
  - BaseItem
  components:
  - type: WeaponCaseInsertable
  - type: MultiHandedItem
  - type: SpawnAfterInteract
    prototype: WeaponTurretAsmgtNtDeployedIHP
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: _Horizon/_Fractions/IHP/Item/Abc.rsi
    state: packed
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    sprite: _Horizon/_Fractions/IHP/Item/Abc.rsi

- type: entity 
  id: WeaponTurretAsmgtNtDeployedIHP
  name: IHP XE-АБС 
  description: |-
   Автоматическая Баллистическая Система - комплексная турель предназначенная для поражения лёгких и средних целей, разработанна специально для Забвения, но это не мешает ей выполнять и прочие задания.
  suffix: IHP
  parent:
  - BaseWeaponTurretMagazineFed
  components:
  - type: HTN
    rootTask:
      task: TurretCompound
    blackboard:
      RotateSpeed: !type:Single
        4.141
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/Silicon/startup.ogg
      VisionRadius: !type:Single
        45
      AggroVisionRadius: !type:Single
        45
      NavSmash: !type:Bool
        true
  - type: Gun
    examineCaliber: gun-examine-caliber-asmgt
  - type: NPCImprintingOnSpawnBehaviour
    whitelist:
      components:
      - HumanoidAppearance
  - type: NpcFactionMember
    factions:
    - IHPTurrel
  - type: Sprite
    sprite: _Horizon/_Fractions/IHP/Item/Abc.rsi
    drawdepth: Mobs
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 11
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineAsmgt
  - type: Construction
    deconstructionTarget: null
    graph: WeaponTurretAsmgtNtPackingGraphIHP
    node: WeaponTurretAsmgtNtPackedIHP
  
- type: constructionGraph # deconstruction graph
  id: WeaponTurretAsmgtNtPackingGraphIHP
  start: WeaponTurretAsmgtNtPackedIHP
  graph:
  - node: WeaponTurretAsmgtNtPackedIHP
    entity: WeaponTurretAsmgtNtDeployedIHP
    edges:
    - to: WeaponTurretAsmgtNtPackedIHP
      completed:
      - !type:SpawnPrototype
            prototype: WeaponTurretAsmgtNtPackedIHP
            amount: 1
      - !type:EmptyAllContainers
      - !type:DeleteEntity {}
      steps:
        - tool: Screwing
          doAfter: 14
# region Оборудование 

- type: entity
  name: Универсальная Вспышка
  parent: Flash
  id: FlashIHP
  description: Улучшенная вспышка разработанная IHP, её исключительное предназначение - уничтожение теней Забвения
  suffix: IHP
  components:
    - type: Sprite
      sprite: _Horizon/_Fractions/IHP/Item/flash.rsi
      layers:
      - state: flash
        map: [ "enum.FlashVisualLayers.BaseLayer" ]
      - state: flashing
        map: [ "enum.FlashVisualLayers.LightLayer" ]
        visible: false
        shader: unshaded
    - type: LimitedCharges
      maxCharges: 10
    - type: Item
      size: Small
      sprite: _Horizon/_Fractions/IHP/Item/flash.rsi
    - type: UseDelay
      delay: 2
    - type: GenericVisualizer
      visuals:
        enum.FlashVisuals.Burnt:
          enum.FlashVisualLayers.BaseLayer:
            True: {state: burnt}
        enum.FlashVisuals.Flashing:
          enum.FlashVisualLayers.LightLayer:
            True: {visible: true}
            False: {visible: false}

- type: entity
  name: Г.П.С
  parent: HandHeldMassScanner
  id: GpsIHP
  description: Глобальная поисковая система - является аналогом глобальной системы позиционирования, но со встроенным сканером масс.
  suffix: IHP
  components:
  - type: Item
    sprite: _Horizon/_Fractions/IHP/Item/gps.rsi
  - type: Sprite
    sprite: _Horizon/_Fractions/IHP/Item/gps.rsi
    state: icon
    layers:
      - state: icon
      - state: scanner
        shader: unshaded
        visible: false
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: RadarConsole
    maxRange: 300
    followEntity: true
  - type: StaticPrice
    price: 250
  - type: Tag
    tags:
    - GPS
  - type: HandheldGPS


# region Курганы / Маяки

# Тир 1 

- type: entity
  id: SporeLighthouseI
  parent: BaseStructure
  name: Мицеливый курган
  suffix: Споры | Мобы
  description: Необычный нарост плоти овальной плоти, от него идут множественные небольшие и крупные корни во все стороны. 
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.5
    baseSprintSpeed: 0.5
  - type: Anchorable
    delay: 2
  - type: PointLight
    radius: 5
    energy: 2
    color: "#642626cc"
  - type: InteractionOutline
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: Sprite
    noRot: true
    sprite: /Textures/_Horizon/_Fractions/IHP/Spore/Mobs/Stadiya1.rsi
    layers:
    - state: mayac
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 190
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: blood
          params:
            variation: 0.250
      - !type:SpawnEntitiesBehavior
        spawn:
          SporeOrganSerdce:
            min: 1
            max: 3
          SporeOrganSoedTkan:
            min: 1
            max: 5
          SporeLootLighthouse:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Timer
  - type: TimedDespawn
    lifetime: 1200
  - type: SpawnOnDespawn
    prototype: SporeLighthouseII
  - type: TimedSpawner
    prototypes:
    - SporeEgg
    intervalSeconds: 200
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 2

# Тир 2
- type: entity
  id: SporeLighthouseII
  parent: BaseStructure
  suffix: Споры | Мобы
  name: Мутированный Мицеливый курган
  description: Массивный нарост плоти представляющей из себя сердце Мицеливого улья. 
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.1
    baseSprintSpeed: 0.1
  - type: Anchorable
    delay: 2
  - type: PointLight
    radius: 7
    energy: 2
    color: "#642626cc"
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    sprite: /Textures/_Horizon/_Fractions/IHP/Spore/Mobs/Stadiya1.rsi
    layers:
    - state: mayac2
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 190
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: blood
          params:
            variation: 0.250
      - !type:SpawnEntitiesBehavior
        spawn:
          SporeLootLighthouse:
            min: 1
            max: 2
          SporeOrganSoedTkan:
            min: 1
            max: 10
          SporeOrganKishki:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Timer
  - type: TimedDespawn
    lifetime: 1800
  - type: SpawnOnDespawn
    prototype: SporeLighthouseIII 
  - type: TimedSpawner
    prototypes:
    - SporeEggII
    - SporeEgg
    - SporeRandomMobsIIAll
    intervalSeconds: 175
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 2




# region Яйца Мобов 
# Кто смеётся с названий тому 3 года. 

 # Тир 1

 # Яйцо спаунит милишников

- type: entity
  parent: MobBaseSpores
  id: SporeEgg
  name: Мицеливый Кокон
  description: Мутироваший Мицеливый Кокон, довольно крупный и вам кажется что он растёт даже на глазах, иногда вздрагивает, но из-за хаотичных движений его корней способен перемещаться
  suffix: Споры | Мобы
  components:
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Sprite
    drawdepth: Mobs
    sprite: /Textures/_Horizon/_Fractions/IHP/Spore/Mobs/Stadiya1.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: spore_egg
  - type: Bloodstream
    bloodMaxVolume: 25
    bloodReagent: SporeBlood
  - type: DamageStateVisuals
    states:
      Alive:
        Base: spore_egg
      Dead:
        Base: dead_egg
  - type: MobThresholds
    thresholds:
      0: Alive
      139: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.1
    baseSprintSpeed: 0.1
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.8
  - type: Stamina
    critThreshold: 100
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    altDisarm: false   
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Heat: 1.8
        Cold: 1.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 140
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: blood
          params:
            variation: 0.250
      - !type:SpawnEntitiesBehavior
        spawn:
          SporeLootEgg:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Timer
  - type: TimedDespawn
    lifetime: 121
  - type: TimedSpawner
    prototypes:
    - SporeRandomMobsDals
    - SporeRandomMobsTank
    - SporeRandomMobsAssasin
    - SporeRandomMobsMal 
    intervalSeconds: 120.9
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1



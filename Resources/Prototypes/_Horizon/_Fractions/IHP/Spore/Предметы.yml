# region Экстракт Спор
- type: reagent
  id: SporeExctrate
  name: Экстракт Спор
  group: Medicine
  desc: Выделенный экстракт грибного заражения, представляет собой микроскопический Мицелий представляющий из себя обычно сгустки и небольшие корешки, на изначальных стадиях может вызывать рвоту головокружение и потерю сознания. Сам по себе не страшен если не является более сильной версией вируса, в небольших количествах почти безвреден для обычных гуманоидов. 
  physicalDesc: непривычное
  flavor: medicine
  color: "#803d3d"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 2.5
            Cellular: 0.5
            Heat: 0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 15
        damage:
          types:
            Asphyxiation: 0.5
            Poison: 1.5
            Heat: 1.5 
      - !type:ChemVomit
        conditions:
        - !type:ReagentThreshold
          min: 30
        probability: 0.02
      - !type:Jitter
        conditions:
        - !type:ReagentThreshold
          min: 15
      - !type:Drunk
  pricePerUnit: 3 # Horizon

# Получение Экстракта 
- type: reaction
  id: SporeExctrateCentrifuge
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    SporeMycelium:
      amount: 10
  products:
    Iron: 4 # Железо
    SporeExctrate: 1 # Экстракт
    Silicon: 5 # Кремний 

- type: reaction
  id: SporeMyceliumCentrifuge
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    SporeBlood:
      amount: 10
  products:
    UncookedAnimalProteins: 4 
    SporeMycelium: 1 # Инфекция Мицелия
    Fat: 5 


# region Реагенты Базовые 
- type: reagent
  id: SporePoison
  name: Мицелиальный ядовитый агент
  desc: Салатовая разъедающая жидкость вызывающее при попадании на кожу сильные ожоги в последствии приводящее к отмиранию тканей, по большей части используется заражёнными Мицелием. 
  physicalDesc: ужасающее
  flavor: bitter
  color: "#95e485"
  boilingPoint: 55.5
  meltingPoint: -50.0
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 5 
            Cellular: 0.5
            Heat: 2.5 
  pricePerUnit: 5

- type: reagent
  id: SporeBlood
  name: Заражённая кровь 
  desc: Необычная довольно вязкая жидкость выкущая по сосудам заражённых Мицелием существ, обладает крайне необычными свойствами что характеризуется в нестандартных реакциях на температуру и общее использование реагента
  physicalDesc: ужасающее
  flavor: bitter
  color: "#503131"
  boilingPoint: 55.5
  meltingPoint: -50.0
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.5
            Cellular: 0.5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 5
          max: 35
        walkSpeedModifier: 0.50
        sprintSpeedModifier: 0.50
  pricePerUnit: 1

- type: reagent
  id: SporeMycelium
  name: Мицеливая Инфекция
  desc: Инфекция в жидком виде, представляет собой микроскопический Мицелий представляющий из себя обычно сгустки и небольшие корешки, на изначальных стадиях может вызывать рвоту головокружение и потерю сознания. Сам по себе не страшен если не является более сильной версией вируса, почти безвреден для обычных гуманоидов. 
  physicalDesc: грибное
  flavor: bitter
  color: "#6e4332"
  boilingPoint: 55.5
  meltingPoint: -50.0
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1.5 
            Cellular: 0.5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 5
          max: 35
        walkSpeedModifier: 0.80
        sprintSpeedModifier: 0.80

      - !type:AdjustReagent            
        conditions:                
        - !type:ReagentThreshold     
          reagent: SporeMycelium
          min: 10
          max: 15
        reagent: Cryptobiolin
        amount: 0.6 

      - !type:AdjustReagent            
        conditions:                
        - !type:ReagentThreshold     
          reagent: SporeMycelium
          min: 0.1
          max: 75
        reagent: SporeMycelium
        amount: 0.2
  pricePerUnit: 5


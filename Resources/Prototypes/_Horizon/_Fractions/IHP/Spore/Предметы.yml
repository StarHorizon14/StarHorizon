# region Люменол 
- type: reagent
  id: SporeLumenol 
  name: Люменол
  group: Medicine
  desc: Необычное вещество на базе Мицеливой Инфекции, требует сильной обработки для синтеза. Обладает крайне необычными свойствами нарастаемого временного усиления организма носителя, единственное ограничение в мощности реагента время его действия. При больших количествах смертельно опасно. 
  physicalDesc: любопытное
  flavor: medicine
  color: "#da2f386f"
  metabolisms:
    Medicine:
      effects:
      - !type:Jitter
        conditions:
        - !type:ReagentThreshold
          min: 15
# 1 - 9
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 1
          max: 9
        damage:
          types:
            Asphyxiation: -0.5
            Poison: -0.5
            Slash: -0.5
            Piercing: -0.5
            Blunt: -0.5
            Heat: -0.5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 1
          max: 9
        walkSpeedModifier: 1.10
        sprintSpeedModifier: 1.10
# 10 - 15
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 10
          max: 15
        damage:
          types:
            Asphyxiation: -1.5
            Poison: -1.5
            Slash: -1.5
            Piercing: -1.5
            Blunt: -1.5
            Bloodloss: -1.5
            Heat: -1.5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 10
          max: 15
        walkSpeedModifier: 1.25
        sprintSpeedModifier: 1.25
# 15 - 25
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 15
          max: 25
        damage:
          types:
            Asphyxiation: -2.5
            Poison: -2.5
            Slash: -2.5
            Piercing: -2.5
            Blunt: -2.5
            Bloodloss: -2.5
            Heat: -2.5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 15
          max: 25
        walkSpeedModifier: 1.30
        sprintSpeedModifier: 1.30
# 25 
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 25
          max: 45
        damage:
          types:
            Asphyxiation: -4.5
            Poison: -4.5
            Slash: -4.5
            Piercing: -4.5
            Blunt: -4.5
            Bloodloss: -4.5
            Heat: -4.5
            Radiation: -4.5 
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 25
          max: 45
        walkSpeedModifier: 1.50
        sprintSpeedModifier: 1.50


      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 45
          max: 45
        damage:
          types:
            Cellular: 0.5
            Poison: 0.5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 45
          max: 45
        walkSpeedModifier: 1.30
        sprintSpeedModifier: 1.30

      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 45
        damage:
          types:
            Cellular: 500
            Poison: 5
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          min: 45
        walkSpeedModifier: 0.50
        sprintSpeedModifier: 0.50

      - !type:AdjustReagent            
        conditions:                
        - !type:ReagentThreshold     
          reagent: SporeLumenol 
          min: 0.1
          max: 35
        reagent: SporeLumenol 
        amount: 0.55

      - !type:AdjustReagent            
        conditions:                
        - !type:ReagentThreshold     
          reagent: SporeLumenol 
          min: 35
        reagent: SporeLumenol 
        amount: 0.75

  pricePerUnit: 50 # Horizon

# SporeBicaridine SporeDylovene SporeDermaline SporeDexalin

- type: reaction
  id: SporeLumenolReact
  impact: Medium
  minTemp: 335
  reactants:
    Ichor: 
      amount: 5
    SporeExctrate:
      amount: 10
    SporeDexalin: 
      amount: 5
    SporeArithrazine:
      amount: 5
    SporeBicaridine: 
      amount: 5
    SporeDylovene: 
      amount: 5
    SporeDermaline:
      amount: 5
  effects:
  - !type:CreateGas
    gas: Plasma
  - !type:PopupMessage
    visualType: LargeCaution
    messages: [ "phlogiston-plasma-created" ]
    type: Pvs
  products:
    SporeLumenol: 1


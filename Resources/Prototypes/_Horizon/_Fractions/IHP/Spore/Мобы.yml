# Способка стрелять карпам

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: ProjectileSporeBreath
  name: Ядовитый разрывной Агент
  description: Необычная синтезированная кислота с высоким шансом взрыва
  components:
  - type: PointLight
    color: "#6cb15e"
    radius: 3.0
    energy: 5.0
  - type: Sprite
    sprite: /Textures/_Horizon/_Fractions/IHP/Spore/spore_toxic.rsi
    layers:
    - state: spore_fireball
      shader: unshaded
  - type: IgnitionSource
    temperature: 1000
    ignited: true
  - type: RepeatingTrigger
    delay: 0.1
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Radioactive
    totalIntensity: 30
    intensitySlope: 0.5
    maxIntensity: 15
    canCreateVacuum: false
    deleteAfterExplosion: false
    repeatable: true
  - type: TimedDespawn
    lifetime: 5
 
- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionProjectileSporeBreath
  name: Выстрелить Ядовитый разрывной Агент
  description: Вы плюётесь во врагов своей необычной синтезированной кислотой с высоким шансом взрыва
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 30
    rechargeSound:
      path: /Audio/Effects/break_stone.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileSporeBreath
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Effects/break_stone.ogg
    soundEmpty: null
    projectileSpeed: 15

- type: entity
  id: ActionSporeBreath
  name: Выстрелить Ядовитый разрывной Агент
  description: Вы плюётесь во врагов своей необычной синтезированной кислотой с высоким шансом взрыва

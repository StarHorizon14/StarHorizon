# region Заражённые пауки


- type: entity
  id: SporeSpiderWeb
  name: Мицелий
  description: Склизкие небольшие темно-красные толи серые корни из которых во все стороны отходят белые шёлковые ниточки. 
  suffix: Споры | Структуры
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: DamageContacts
      damage:
        groups:
          Brute: 0.05
      ignoreWhitelist:
        tags:
        - SporeWebMobs
        - CannotSuicide
    - type: MeleeSound
      soundGroups:
        Brute:
          path:
            "/Audio/Weapons/genhit3.ogg"

    - type: Sprite
      sprite: /Textures/_Horizon/_Fractions/IHP/Spore/Mobs/SporeWeb.rsi
      layers:
      - state: spider_web_1
        map: ["random"]
    - type: RandomSprite
      available:
      - random:
          spider_web_1: ""
          spider_web_2: ""
          spider_web_3: ""
          spider_web_4: ""
          spider_web_5: ""

    - type: Appearance
    - type: Clickable
    - type: Transform
      anchored: true

    - type: Slippery
    - type: StepTrigger
      intersectRatio: 0.2
    - type: Physics
    - type: Fixtures
      fixtures:
        slips:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.3,0.4,0.3"
          hard: false
          layer:
          - SlipLayer
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.3,0.4,0.3"
          density: 1000
          mask:
          - ItemMask
    - type: Damageable
      damageModifierSet: Wood
    - type: Destructible
      thresholds:
      - trigger: # Excess damage, don't spawn entities
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:SpawnEntitiesBehavior
          spawn:
            SporeOrganSoedTkan:
              min: 0
              max: 1
    - type: Temperature
      heatDamage:
        types:
          Heat: 5
      coldDamage: {}
      coldDamageThreshold: 0
    - type: Flammable
      fireSpread: true
      damage:
        types:
          Heat: 5
    - type: Reactive
      groups:
        Flammable: [Touch]
        Extinguish: [Touch]
    - type: SpiderWebObject
    - type: SpeedModifierContacts
      walkSpeedModifier: 0.5
      sprintSpeedModifier: 0.5
      ignoreWhitelist:
        tags:
        - SporeWebMobs
    - type: FlavorProfile
      flavors:
        - sweet
    - type: Food
      delay: 2
    - type: SolutionContainerManager
      solutions:
        food:
          reagents:
          - ReagentId: Sugar
            Quantity: 2


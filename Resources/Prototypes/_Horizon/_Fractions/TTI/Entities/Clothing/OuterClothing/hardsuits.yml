#region Trauma
#Trauma team EVA
- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitTraumaTeam
  suffix: TraumaTeam
  name: EVA парамедика траумы
  description: Стандартный образец герметичного комплекта брони Trauma Team Interstellar, усилен более крепким материалом для работы в безвоздушном пространстве.
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/TTI/Clothing/OuterClothing/Hardsuits/traumateam.rsi
  - type: Clothing
    sprite: _Horizon/_Fractions/TTI/Clothing/OuterClothing/Hardsuits/traumateam.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: TraumaTeamHelmet


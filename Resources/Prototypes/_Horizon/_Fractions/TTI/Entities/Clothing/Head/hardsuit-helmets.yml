#region Trauma
#Trauma EVA
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: TraumaTeamHelmet
  name: EVA шлем парамедика траумы
  description: Лёгкий шлем парамедиков TTI, адаптированный для действий в безвоздушном пространстве.
  suffix: TraumaTeam
  components:
  - type: Sprite
    sprite: _Horizon/_Fractions/TTI/Clothing/Head/Hardsuits/trauma.rsi
  - type: Clothing
    sprite: _Horizon/_Fractions/TTI/Clothing/Head/Hardsuits/trauma.rsi
  - type: PointLight
    color: "#00FFFF"
    radius: 10
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
        Radiation: 0.90
        Caustic: 0.90
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000


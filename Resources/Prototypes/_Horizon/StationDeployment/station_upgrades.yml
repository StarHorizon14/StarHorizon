# but lose power the moment they're re-anchored off their bound station's grid - see
# BindToStationSystem.DisableOffGridCableDevices and StationUpgradeEquipmentSystem.OnMapInit.

- type: entity
  parent: SalvageMagnet
  id: StationUpgradeSalvageMagnet
  suffix: Station Upgrade
  components:
  - type: StationUpgradeEquipment


- type: constructionGraph
  id: GraphShuttleMagnet
  start: start

  graph:
    - node: start
      edges:
        - to: assembly
          completed:
          - !type:SetAnchor
            value: false
          steps:
          - material: Steel
            amount: 2
            doAfter: 2

    - node: assembly
      entity: ShuttleMagnetAssembly
      actions:
      - !type:SnapToGrid {}
      - !type:SetAnchor {}
      edges:
      - to: wired
        conditions:
        - !type:EntityAnchored {}
        steps:
        - material: Cable
          amount: 5
          doAfter: 2.5
      - to: start
        conditions:
        - !type:EntityAnchored
          anchored: false
        completed:
        - !type:SpawnPrototype
          prototype: SheetSteel1
          amount: 2
        - !type:DeleteEntity {}
        steps:
        - tool: Prying
          doAfter: 2

    - node: wired
      edges:
      - to: assembly
        completed:
        - !type:SpawnPrototype
          prototype: CableApcStack1
          amount: 5
        steps:
        - tool: Cutting
          doAfter: 2
      - to: complete
        conditions:
        - !type:EntityAnchored {}
        steps:
        - material: Plasteel
          amount: 2
          doAfter: 2

    - node: complete
      entity: ShuttleMagnet
      edges:
        - to: wired
          completed:
          - !type:SpawnPrototype
            prototype: SheetPlasteel1
            amount: 2
          steps:
          - tool: Welding
            doAfter: 5








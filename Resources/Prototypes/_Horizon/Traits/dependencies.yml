# region Dependencies
# Withdrawal stages are cumulative and are counted from the last dose (time is in seconds).

- type: trait
  id: AlcoholDependency
  name: trait-alcohol-dependency-name
  description: trait-alcohol-dependency-desc
  category: HorizonNegative
  group: TraitDependency
  cost: -5
  components:
  - type: SubstanceDependency
    metabolismGroups:
    - Alcohol
    reliefMessage: dependency-alcohol-relief
    cravingMessages:
    - dependency-alcohol-craving-1
    - dependency-alcohol-craving-2
    - dependency-alcohol-craving-3
    - dependency-alcohol-craving-4
    stages:
    - time: 600
      effects: [ Slowdown ]
      message: dependency-alcohol-stage-1
    - time: 900
      effects: [ Clouding ]
      message: dependency-alcohol-stage-2
    - time: 1200
      effects: [ AimPenalty ]
      message: dependency-alcohol-stage-3
    - time: 1800
      effects: [ Vomit, Sleep ]
      message: dependency-alcohol-stage-4
    - time: 3600
      effects: [ Poison ]
      message: dependency-alcohol-stage-5


- type: entity
  id: AdvancedRCD
  parent: BaseItem
  name: Строительный пистолет
  description: Строительный пистолет - многофункциональный инструмент, использующийся Первопроходцами. Он используется для строительства и демонтажа построек.
  components:
    - type: Sprite
      sprite: _NF/Objects/Tools/rcd.rsi
      state: icon
    - type: Item
      size: Normal
      sprite: _NF/Objects/Tools/rcd.rsi
    - type: AdvancedRCD
      availablePrototypes:
        - AdvRcdWallSolid
        - AdvRcdWallReinforced
        - AdvRcdWallPlastic
        - AdvRcdWallWood
        - AdvRcdGrille
        - AdvRcdWindow
        - AdvRcdWindowDirectional
        - AdvRcdReinforcedWindowDirectional
        - AdvRcdAirlock
        - AdvRcdAirlockGlass
        - AdvRcdCableApcExtension
        - AdvRcdPoweredlightLED
        - AdvRcdPoweredSmallLight
        - AdvRcdDeconstruct
      materialLimit: 60
      range: 5
    - type: MaterialStorage
      insertOnInteract: true
      dropOnDeconstruct: true
      materialWhiteList:
        - Steel
        - Glass
        - Plasteel
        - Plastic
        - Wood
        - Uranium
        - Silver
        - Gold
    - type: OreSiloClient
    - type: UserInterface
      interfaces:
        enum.AdvancedRCDUiKey.Key:
          type: AdvancedRCDMenuBoundUserInterface
    - type: ActivatableUI
      key: enum.AdvancedRCDUiKey.Key

- type: entity
  id: AdvancedRCDUnlimited

  components:
    - type: AdvancedRCD
      availablePrototypes:
        - AdvRcdWallSolid
        - AdvRcdWallReinforced
        - AdvRcdWallPlastic
        - AdvRcdWallWood
        - AdvRcdGrille
        - AdvRcdWindow
        - AdvRcdWindowDirectional
        - AdvRcdReinforcedWindowDirectional
        - AdvRcdAirlock
        - AdvRcdAirlockGlass
        - AdvRcdCableApcExtension
        - AdvRcdPoweredlightLED
        - AdvRcdPoweredSmallLight
        - AdvRcdDeconstruct
      materialLimit: null
      range: 10
    - type: MaterialStorage
      storageLimit: null

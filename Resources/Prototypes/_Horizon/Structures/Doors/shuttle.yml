- type: entity
  parent: BaseStructure
  id: ShuttleMagnet
  suffix: Docking
  name: Магнит для шаттлов
  description: Стыковка шаттлов теперь без шлюзов.
  components:
  - type: Docking
    dockType: Airlock
  - type: DockingSignalControl
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: StationAiWhitelist
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/smash.ogg"
  - type: InteractionOutline
  - type: Sprite
    sprite: _Horizon/Structures/Doors/shuttle-magnet.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - SubfloorMask
  - type: Door
    openDrawDepth: HighFloorObjects
    closedDrawDepth: HighFloorObjects
    bumpOpen: false
    clickOpen: false
    canCrush: false
    CanPry: false
    openSound:
      path: /Audio/Machines/airlock_open.ogg
    closeSound:
      path: /Audio/Machines/airlock_close.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: NavMapDoor
  - type: Appearance
  - type: DeviceLinkSource
    ports:
      - DockStatus
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      # TODO this should go to the broken node first
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: StaticPrice
    price: 150
  - type: Construction
    graph: GraphShuttleMagnet
    node: complete
  placement:
    mode: SnapgridCenter

- type: entity
  id: ShuttleMagnetAssembly
  parent: AirlockAssembly
  name: каркас магнита для шаттлов
  suffix: Docking
  description: Скоро он будет держать огромные линкоры друг с другом.
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Rotatable
  - type: Sprite
    sprite: _Horizon/Structures/Doors/shuttle-magnet.rsi
    state: assembly
  - type: Construction
    graph: GraphShuttleMagnet
    node: assembly
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - SubfloorMask

- type: entity
  name: shuttle impact marker
  id: ShuttleImpactMarker
  parent: MarkerBase
  suffix: Trigger
  components:
  - type: Sprite
    sprite: Interface/Alerts/shuttle.rsi
    state: piloting
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: GridCollisionOnTrigger
    throwStrength: 4
    damage:
      types:
        Blunt: 3
    knockdownTime: 2

- type: entity
  name: shuttle impact marker
  id: ShuttleImpactMarkerItems
  parent: MarkerBase
  suffix: Trigger, Items
  components:
  - type: Sprite
    sprite: Interface/Alerts/shuttle.rsi
    state: piloting
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: GridCollisionOnTrigger
    throwStrength: 4
    affectMobs: false

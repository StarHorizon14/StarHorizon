- type: entity
  id: OreMiningDrill
  parent: [ BaseStructureDynamic, BaseMachinePowered, ConstructibleMachine]
  name: буровая установка для добычи руды
  description: Мощная буровая установка для разработки рудных месторождений на астероидах.
  placement:
    mode: SnapgridCenter
  components:
  - type: OreExtractor
    luck: 1
    efficiency: 3.0
  - type: Transform
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Sprite
    sprite: _Horizon/Objects/Specific/Mining/extractor.rsi
    snapCardinals: true
    granularLayersRendering: true
    layers:
      - state: drill-off
        map: [ "drill" ]
      - state: base
      - state: base-powered
        shader: unshaded
        visible: false
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      - state: drill-empty-unlit
        shader: unshaded
        map: [ "light" ]
        visible: false
  - type: Physics
    bodyType: Static
  - type: PowerSwitch
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Machine
    board: OreMiningDrillMachineCircuitboard
  - type: Appearance
  - type: MagnetPickup # Притягивание руды, сделано что бы не нагружать сервер в лишний раз
    magnetEnabled: true
    magnetCanBeEnabled: true
    range: 0.5
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,3
    quickInsert: false
    areaInsert: false
    сlickInsert: false
    openOnActivate: true
    storageInsertSound: null
    whitelist:
      tags:
        - ArtifactFragment
        - Ore
  - type: BindToStation
    enabled: false # should be draggable between stations

- type: entity
  id: ShipMiningDrill
  name: Ship Mining Drill
  description: For drilling through rocks while sitting in a chair.
  placement:
    mode: SnapgridCenter
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Rotatable
    rotateWhilePulling: false
    rotateWhileAnchored: false
    increment: 45
  - type: Sprite
    sprite: _Horizon/Structures/Machines/mining_drill.rsi
    layers:
    - state: drill
  - type: ShipDrill
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
  - type: Anchorable
    delay: 10
  - type: ApcPowerReceiver
    powerLoad: 10000 # 10 kW per one
  - type: ExtensionCableReceiver
  - type: StaticPrice
    price: 1000 # заребалансить надо

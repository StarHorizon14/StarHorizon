# Shipbreaking machines. All pay the station bank account. Sprites are placeholders (recycler).
# Ported TileReclaimer from space-wizards/space-station-14#43651.

# Furnace: burns loose floor tile items and pipes (paid), and the tiles of grids pushed into it (not paid).
- type: entity
  id: ShipbreakingFurnace
  parent: BaseScrapProcessor
  components:
  - type: Sprite
    drawdepth: Doors
    sprite: _Horizon/Structures/Machines/shipbreaking/furnace.rsi
    offset: 0,0.5
    layers:
    - state: base
      map: ["base"]
    - state: working
      map: ["working"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        working:
          Off: { visible: false }
          Forward: { visible: true }
          Reverse: { visible: true }
  # Burns the tiles of a grid pushed into it, for nothing.
  - type: TileReclaimer
    pay: false
    whitelist:
      components:
      - Shuttle
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      components:
      - FloorTile
      - AtmosPipeLayers

# Processor: eats whole grids (shuttle tiles) pulled into it and buys loose walls and cable coils.
- type: entity
  id: ShipbreakingProcessor
  parent: BaseScrapProcessor
  components:
  - type: Sprite
    drawdepth: Doors
    sprite: _Horizon/Structures/Machines/shipbreaking/processor.rsi
    offset: 0,0.5
    layers:
    - state: base
      map: ["base"]
    - state: working
      map: ["working"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        working:
          Off: { visible: false }
          Forward: { visible: true }
          Reverse: { visible: true }
  - type: TileReclaimer
    efficiency: 5 # tiles are paid for in money, see ServerTileReclaimerSystem
    whitelist:
      components:
      - Shuttle
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      tags:
      - Wall
      - CableCoil

# No grid whitelist: eats any grid pushed into it, including stations. Admin only.
- type: entity
  id: ShipbreakingProcessorAdmeme
  parent: BaseScrapProcessor
  suffix: Admeme
  components:
  - type: Sprite
    drawdepth: Doors
    sprite: _Horizon/Structures/Machines/shipbreaking/processor.rsi
    offset: 0,0.5
    layers:
    - state: base
      map: ["base"]
    - state: working
      map: ["working"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        working:
          Off: { visible: false }
          Forward: { visible: true }
          Reverse: { visible: true }
  - type: TileReclaimer
    efficiency: 5
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3

# Shipbreaking scrap processors: buy loose entities (fed in by conveyors) and pay the station bank account.
# Sprites: furnace.rsi (crusher), processor.rsi (shredder), barge.rsi; the base machine keeps the recycler as a fallback.
- type: entity
  id: BaseScrapProcessor
  parent: BaseMachinePowered
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      brrt:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        layer:
        - FullTileLayer
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: DeviceLinkSink
    ports:
      - Reverse
      - Forward
      - Off
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Doors
    sprite: Structures/Machines/recycling.rsi
    layers:
    - state: grinder-o0
  - type: Conveyor
  - type: Rotatable
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

# Barge: a pallet that buys everything left on it (furniture, crates, parts), except walls, floor tiles and the living.
# Like the selling pallets of the cargo console, without the console. Sprite: barge.rsi, smoothed like the cargo pallets.
- type: entity
  id: ShipbreakingBarge
  parent: BaseCargoPallet
  components:
  # No layers on the sprite (the empty list drops the catwalk layer of the cargo pallet): IconSmooth adds the corner
  # layers itself, a layer of its own would show under them.
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _Horizon/Structures/Machines/shipbreaking/barge.rsi
    layers: []
  - type: Icon
    sprite: _Horizon/Structures/Machines/shipbreaking/barge.rsi
    state: full
  - type: IconSmooth
    key: shipbreaking_barge
    base: state_
  - type: ScrapPallet
    sound:
      path: /Audio/Effects/Cargo/ping.ogg
    blacklist:
      tags:
      - Wall
      components:
      - FloorTile
      - MobState

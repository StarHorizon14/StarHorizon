
- type: entity
  id: ShipbreakingFurnace
  parent: BaseScrapProcessor
  components:
  - type: Sprite
    drawdepth: Doors
    sprite: _Horizon/Structures/Machines/shipbreaking/furnace.rsi
    offset: 0,0.5
    layers:
    - state: base
      map: ["base"]
    - state: working
      map: ["working"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConveyorVisuals.State:
        working:
          Off: { visible: false }
          Forward: { visible: true }
          Reverse: { visible: true }
  - type: TileReclaimer
    pay: false
    recyclingBox: -0.35,-1,0.35,-0.5
    whitelist:
      components:
      - Shuttle
    blacklist:
      components:
      - StationMember
      - CargoShuttle
      - ArrivalsShuttle
      - EmergencyShuttle
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
  - type: ScrapProcessor
    burnDamage:
      types:
        Heat: 5
    burnSound:
      path: /Audio/Effects/sizzle.ogg
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      components:
      - FloorTile
      - AtmosPipeLayers


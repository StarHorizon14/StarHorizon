- type: entity
  id: BaseScrapProcessor
  parent: BaseMachinePowered
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      brrt:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5, -0.75, 0.5, 0.15"
        hard: false
        layer:
        - FullTileLayer
        - DoorPassable
        mask:
        - FullTileMask
        - TabletopMachineLayer
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: DeviceLinkSink
    ports:
      - Reverse
      - Forward
      - Off
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Doors
    sprite: Structures/Machines/recycling.rsi
    layers:
    - state: grinder-o0
  - type: Conveyor
    angle: 90
    state: Forward
  - type: Rotatable
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: ShipbreakingBarge
  parent: BaseCargoPallet
  components:
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _Horizon/Structures/Machines/shipbreaking/barge.rsi
    layers: []
  - type: Icon
    sprite: _Horizon/Structures/Machines/shipbreaking/barge.rsi
    state: full
  - type: IconSmooth
    key: shipbreaking_barge
    base: state_
  - type: ScrapPallet
    sound:
      path: /Audio/Effects/Cargo/ping.ogg
    blacklist:
      tags:
      - Wall
      components:
      - FloorTile
      - MobState

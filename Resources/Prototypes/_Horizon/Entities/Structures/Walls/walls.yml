- type: entity
  parent: BaseWall
  id: WallShuttleIndestructible
  name: стена шаттла
  description: Удерживает воздух внутри, а ассистентов снаружи.
  suffix: indestructible
  components:
    - type: Sprite
      sprite: Structures/Walls/shuttle.rsi
    - type: Icon
      sprite: Structures/Walls/shuttle.rsi
      state: full
    - type: IconSmooth
      key: walls
      base: state
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          mask:
          - FullTileMask
          layer:
          - WallLayer
          density: 4000
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: StructuralMetallicStrong
    - type: RadiationBlocker
      resistance: 5


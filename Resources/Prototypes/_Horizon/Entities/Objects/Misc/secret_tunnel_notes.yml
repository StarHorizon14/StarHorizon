# Notes handed to syndicate and pirate players: they name the expedition planet their secret FTL tunnel goes through.
# The server writes the planet name into the paper (see SecretTunnelSystem).
- type: entity
  parent: Paper
  id: SecretTunnelNoteSyndicate
  name: syndicate intelligence letter
  description: A folded letter marked with a red stamp.
  components:
  - type: SecretTunnelNote
    tunnelId: syndicate
    text: secret-tunnel-note-syndicate
  # Same red "Syndicate Logistics" stamp as the suspicious faxes.
  - type: Paper
    stampState: paper_stamp-syndicate
    stampedBy:
    - stampedName: secret-tunnel-note-syndicate-stamp
      stampedColor: "#850000"

# Pirates have no stamp: the note is signed with a scrawl, on a sheet that looks like it has been through a few fights.
- type: entity
  parent: Paper
  id: SecretTunnelNotePirate
  name: crumpled note
  description: A crumpled note covered in rough handwriting.
  components:
  - type: SecretTunnelNote
    tunnelId: pirate
    text: secret-tunnel-note-pirate
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      color: "#D9C7A0"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
      color: "#D9C7A0"
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Paper
    stampState: paper_stamp-nf-signature
    stampedBy:
    - stampedName: secret-tunnel-note-pirate-stamp
      stampedColor: "#7a1f1f"

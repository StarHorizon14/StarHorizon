- type: entity
  id: ShipTool
  parent:
  - BaseItem
  - PowerCellSlotMediumItem
  name: ship cutter
  description: A heavy battery powered plasma cutter for taking ships apart. Use it in hand to switch to welding.
  components:
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _Horizon/Objects/Tools/ship_tool.rsi
    quickEquip: false
    slots:
    - belt
  - type: Sprite
    sprite: _Horizon/Objects/Tools/ship_tool.rsi
    layers:
    - state: icon
      map: ["base"]
    - state: cutter_flame
      map: ["flame"]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerCellSlotVisuals.Enabled:
        flame:
          True: { visible: true }
          False: { visible: false }
  - type: ShipCutter
    cutSprite:
      sprite: _Horizon/Objects/Tools/ship_tool.rsi
      state: icon
    weldSprite:
      sprite: _Horizon/Objects/Tools/ship_tool.rsi
      state: icon
    changeSound:
      path: /Audio/Items/change_drill.ogg
    wallWhitelist:
      tags:
      - Wall
  - type: SeamWelder

- type: entity
  id: ShipToolUtilization
  parent: ShipTool
  components:
  - type: ShipCutter
    requireUtilization: true

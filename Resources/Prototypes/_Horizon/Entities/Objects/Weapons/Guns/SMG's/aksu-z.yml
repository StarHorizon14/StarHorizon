# АКС-74У Зенит от Совельве и Архистратега
- type: entity
  name: АКС-74У Зенит
  parent: [BaseWeaponSubMachineGun]
  id: WLAksu
  suffix: Солянка
  description: Тактикульно, стильно, клёво.
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Weapons/Guns/SMGs/aksu-z/big.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Horizon/Objects/Weapons/Guns/SMGs/aksu-z/tiny.rsi
  - type: Item
    size: Large
    sprite: _Horizon/Objects/Weapons/Guns/SMGs/aksu-z/tiny.rsi
  - type: GunRequiresWield
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -36
  - type: Gun
    minAngle: 25
    maxAngle: 39
    fireRate: 6.5
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/_Horizon/Weapons/Guns/Gunshots/aksu-z_fire.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      cell_slot: !type:ContainerSlot
  - type: ItemTogglePointLight
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Tag
    tags:
    - Flashlight
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6

# AR-15 SOPMOD от Совельве и Нябулон

- type: entity
  name: AR-15 sop mod
  parent: [BaseWeaponRifle]
  id: WLAR-15sopmod
  suffix: Солянка
  description: Для настоящих операторов.
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Weapons/Guns/Rifles/ar15sm.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Horizon/Objects/Weapons/Guns/Rifles/ar15sm.rsi
  - type: Item
    size: Large
    sprite: _Horizon/Objects/Weapons/Guns/Rifles/ar15sm.rsi
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -36
  - type: Gun
    minAngle: 26
    maxAngle: 40
    fireRate: 6.5
    burstFireRate: 12
    selectedMode: Burst
    availableModes:
    - Burst
    - SemiAuto
    soundGunshot:
      path: /Audio/_Horizon/Weapons/Guns/Gunshots/ar15sm-fire.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      cell_slot: !type:ContainerSlot
  - type: ItemTogglePointLight
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Tag
    tags:
    - Flashlight
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6

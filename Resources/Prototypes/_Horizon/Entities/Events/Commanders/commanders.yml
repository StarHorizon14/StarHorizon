# region Артиллерия

- type: entity
  name: "наводчик артиллерии"
  parent: [ BaseItem ]
  id: eventMissleTransmitterGrenade
  description: "Киньте его в нужное место и он автоматически развернётся."
  suffix: ИВЕНТ
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/transmitter.rsi
    state: grenade
  - type: DamageOnLand
    damage:
      types:
        Blunt: 999
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          eventMissleTransmitter:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  name: "сломанный наводчик"
  parent: [ BaseItem ]
  id: eventMissleTransmitterScrap
  description: "Теперь это бесполезный кусок пластика."
  suffix: ИВЕНТ
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/transmitter.rsi
    state: scrap

- type: entity
  id: eventMissleTransmitter
  name: "наводчик артиллерии"
  description: "Передаёт сигнал для наводки артиллерии. Если вы его увидели - то лучше бегите..."
  suffix: ИВЕНТ, Активирован
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/transmitter.rsi
    noRot: true
    offset: 0.0, 0.5
    layers:
    - state: transmitter
    - state: transmitter_lit
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: eventMissleSpawnDelay
    predicted: true
  - type: TriggerOnSpawn
    keyOut: timer
  - type: PointLight
    color: "#2272da"
    energy: 4
    radius: 6
    softness: 1
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Horizon/Events/Commanders/deploy.ogg
  - type: TimedDespawn
    lifetime: 27
  - type: SpawnOnDespawn
    prototype: eventMissleTransmitterScrap

- type: entity
  id: eventMissleSpawnDelay
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: red
  - type: TimedDespawn
    lifetime: 5
  - type: SpawnOnDespawn
    prototype: eventMissleSpawn

- type: entity
  id: eventMissleSpawn
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: red
  - type: TimedDespawn
    lifetime: 5
  - type: TimedSpawner
    prototypes:
    - eventArmPointerSpawn
    intervalSeconds: 0.1
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: eventMissleSound
    predicted: true
  - type: TriggerOnSpawn
    keyOut: timer

- type: entity
  id: eventMissleSound
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: blue
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: TimedDespawn
    lifetime: 10
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Horizon/Events/Commanders/mortair.ogg
      params:
        maxDistance: 999
        rolloffFactor: 0
  - type: SingularityDistortion
    intensity: 0
    falloffPower: 100

- type: entity
  id: eventArmPointer
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: blue
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Transform
    anchored: false
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: TimedDespawn
    lifetime: 8
  - type: SpawnOnDespawn
    prototype: eventBombPointerSpawn

- type: entity
  id: eventArmPointerSpawn
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: blue
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ScatteringGrenade
    fillPrototype: eventArmPointer
    distance: 3
    velocity: 10
    capacity: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: TriggerOnSpawn
    keyOut: timer

- type: entity
  id: eventBombPointer
  parent: eventArmPointer
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnDespawn
    prototype: eventBombSpawnDelay

- type: entity
  id: eventBombPointerSpawn
  parent: eventArmPointerSpawn
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: ScatteringGrenade
    fillPrototype: eventBombPointer

- type: entity
  id: eventBombSpawnDelay
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: red
  - type: TimedDespawn
    lifetime: 5
  - type: SpawnOnDespawn
    prototype: eventMissile

- type: entity
  name: "бомба"
  description: "Так ли безопасно стоять здесь и смотреть на неё?"
  id: eventMissile
  suffix: ИВЕНТ
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/bomb_fall.rsi
    offset: 0, 2.0
    drawdepth: Effects
    noRot: true
    layers:
    - state: base
  - type: TimedDespawn
    lifetime: 0.4
  - type: SpawnOnDespawn
    prototype: eventMissileExplosion
  - type: PointLight
    color: "#FBA514"
    energy: 4
    radius: 4
    softness: 1
  - type: AmbientSound
    range: 14
    volume: 2
    sound:
      path: /Audio/_Horizon/Events/Commanders/bomb_fall.ogg

- type: entity
  id: eventMissileExplosion
  name: взрыв
  suffix: ИВЕНТ
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120
    canCreateVacuum: false

# endregion Артиллерия

# region Маяк

- type: entity
  name: "маяк"
  parent: [ BaseItem ]
  id: eventBeaconItem
  description: "Установите его на заданной точке и подождите 2 минуты."
  suffix: ИВЕНТ
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/transmitter.rsi
    state: beacon
  - type: SpawnAfterInteract 
    prototype: eventBeacon
    doAfter: 10
    removeOnInteract: true
  - type: Item
    size: Normal

- type: entity
  id: eventBeacon
  name: "маяк"
  description: "Наводит высокоточную авиационную бомбу. Отключи его пока ещё есть время!"
  suffix: ИВЕНТ, Активирован
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/beacon.rsi
    noRot: true
    offset: 0.0, 1.0
    drawdepth: Mobs
    layers:
    - state: base
    - state: beam
      shader: unshaded
  - type: PointLight
    color: "#2272da"
    energy: 4
    radius: 6
    softness: 1
  - type: AmbientSound
    range: 10
    volume: 2
    sound:
      path: /Audio/_Horizon/Events/Commanders/beep.ogg
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Horizon/Events/Commanders/beacon_deploy.ogg
  - type: TimedDespawn
    lifetime: 120
  - type: SpawnOnDespawn
    prototype: eventBeaconAlarm
  - type: Construction
    graph: eventBeacon
    node: start
    defaultTarget: disarm

- type: entity
  id: eventBeaconScrap
  name: "сломанный маяк"
  description: "Это полный провал..."
  suffix: ИВЕНТ
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/beacon.rsi
    noRot: true
    offset: 0.0, 1.0
    drawdepth: Mobs
    layers:
    - state: break
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Horizon/Events/Commanders/break.ogg

- type: entity
  id: eventBeaconAlarm
  name: "маяк"
  description: "Лучше бежать и не оборачиваться..."
  suffix: ИВЕНТ
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/beacon.rsi
    noRot: true
    offset: 0.0, 1.0
    drawdepth: Mobs
    layers:
    - state: base
    - state: alarm
      shader: unshaded
  - type: PointLight
    color: "#2272da"
    energy: 2
    radius: 3
    softness: 1
  - type: TimedDespawn
    lifetime: 26
  - type: SingularityDistortion
    intensity: 0
    falloffPower: 100
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: eventBigBompDelay
    predicted: true
  - type: TriggerOnSpawn
    keyOut: timer

- type: entity
  id: eventBigBompDelay
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: blue
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: TimedDespawn
    lifetime: 26
  - type: SpawnOnDespawn
    prototype: eventBigBomb
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: eventBeaconAlarmSound
    predicted: true
  - type: TriggerOnSpawn
    keyOut: timer

- type: entity
  id: eventBeaconAlarmSound
  parent: MarkerBase
  suffix: ИВЕНТ, Технический
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: blue
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: TimedDespawn
    lifetime: 36
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Horizon/Events/Commanders/bomb_big.ogg
      params:
        maxDistance: 999
        rolloffFactor: 0
  - type: SingularityDistortion
    intensity: 0
    falloffPower: 100
  
- type: entity
  name: "высокоточная бомба"
  description: "Так ли безопасно стоять здесь и смотреть на неё?"
  id: eventBigBomb
  suffix: ИВЕНТ
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/bomb_fall.rsi
    offset: 0, 2.0
    drawdepth: Effects
    noRot: true
    layers:
    - state: base
  - type: TimedDespawn
    lifetime: 0.4
  - type: SpawnOnDespawn
    prototype: eventBigBombExplosion
  - type: PointLight
    color: "#FBA514"
    energy: 4
    radius: 4
    softness: 1
  - type: AmbientSound
    range: 14
    volume: 2
    sound:
      path: /Audio/_Horizon/Events/Commanders/bomb_fall.ogg

- type: entity
  id: eventBigBombExplosion
  name: мощный взрыв
  suffix: ИВЕНТ
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 40
    totalIntensity: 16000
    canCreateVacuum: false

- type: constructionGraph
  id: eventBeacon
  start: start
  graph:
    - node: start
      entity: eventBeacon
      edges:
        - to: disarm
          completed:
            - !type:SpawnPrototype
                prototype: eventBeaconScrap
                amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Slicing
              doAfter: 10

    - node: disarm
      entity: eventBeaconScrap

# region Дрон

- type: entity
  name: "дрон"
  parent: [ BaseItem ]
  id: eventDroneItem
  description: "Чёрный дрон с большой буквой S на верхней крышке. Обладает ИИ и камерой."
  suffix: ИВЕНТ
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/drone.rsi
    state: item
    scale: 0.7, 0.7
  - type: SpawnAfterInteract 
    prototype: eventDroneDeploy
    doAfter: 0.5
    removeOnInteract: true
  - type: Item
    size: Normal

- type: entity
  id: eventDroneDeploy
  name: "дрон"
  description: "Чёрный дрон с большой буквой S на верхней крышке. Обладает ИИ и камерой."
  suffix: ИВЕНТ
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/drone.rsi
    noRot: true
    drawdepth: Mobs
    scale: 0.7, 0.7
    layers:
    - state: deploy
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Horizon/Events/Commanders/drone_deploy.ogg
  - type: TimedDespawn
    lifetime: 3.5
  - type: SpawnOnDespawn
    prototype: eventDrone

- type: entity
  name: "дрон"
  id: eventDrone
  description: "Чёрный дрон с большой буквой S на верхней крышке. О нет! Он летит на вас!"
  parent: [FlyingMobBase, BaseMob]
  suffix: ИВЕНТ
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Horizon/Objects/Events/Commanders/drone.rsi
    scale: 0.7, 0.7
    layers:
    - state: base
    - state: transparent
    - state: unshaded
      shader: unshaded
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: AmbientSound
    volume: -4
    range: 6
    sound:
      path: /Audio/_Horizon/Events/Commanders/drone.ogg
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
        - SurveillanceCamera
        - SurveillanceCameraMonitor
        - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
  - type: Eye
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SurveillanceCameraEntertainment
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    setupAvailableNetworks:
      - SurveillanceCameraEntertainment
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Syndicate
  - type: ActiveRadio
    channels:
    - Syndicate
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:ExplodeBehavior
  - type: MovementSpeedModifier
    baseWalkSpeed: 9
    baseSprintSpeed: 4
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 16
    totalIntensity: 720
    canCreateVacuum: false
  - type: AutoImplant
    implants:
    - eventDroneBomb

- type: entity
  parent: BaseSubdermalImplant
  id: eventDroneBomb
  components:
  - type: SubdermalImplant
    #permanent: true
    implantAction: ActionActivateMicroBomb
  - type: TriggerOnActivateImplant
  - type: ExplodeOnTrigger
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 16
    totalIntensity: 720
    canCreateVacuum: false

- type: entity
  parent: [ BaseItem ]
  id: eventDroneMonitor
  name: "монитор дрона"
  description: "Позволяет просматривать изображения с камеры дрона."
  suffix: ИВЕНТ
  components:
  - type: Sprite
    sprite: _Horizon/Objects/Events/Commanders/misc.rsi
    scale: 1.0, 1.0
    layers:
    - state: monitor
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SurveillanceCamera
    transmitFrequencyId: SurveillanceCamera
  - type: WirelessNetworkConnection
    range: 2000
  - type: Speech
    speechVerb: Robotic
  - type: SurveillanceCameraSpeaker
  - type: SurveillanceCameraMonitor
  - type: ActivatableUI
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: ActivatableUIRequiresVision
  - type: UserInterface
    interfaces:
        enum.SurveillanceCameraMonitorUiKey.Key:
          type: SurveillanceCameraMonitorBoundUserInterface

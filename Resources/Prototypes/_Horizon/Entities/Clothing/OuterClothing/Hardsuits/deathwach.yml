- type: entity
  parent: [ClothingOuterHardsuitBaseNF]
  id: ClothingOuterHardsuitDeathwatchUltramar
  name: броня караула смерти
  description: Черный доспех с правым наплечником ордена ульрамаринов.
  components:
  - type: Sprite
    sprite: _Horizon/Clothing/OuterClothing/Hardsuits/deathwatch.rsi
  - type: Clothing
    sprite: _Horizon/Clothing/OuterClothing/Hardsuits/deathwatch.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitDeathwatch
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
        Cold: 0.3
        Shock: 0.3
        Radiation: 0.35
        Caustic: 0.3
  - type: FireProtection
    reduction: 0.2
  - type: ClothingSpeedModifier
    sprintModifier: 0.8
  - type: AntiRottingContainer
  - type: JumpAbility
    jumpDistance: 4
    jumpSound: /Audio/Effects/stealthoff.ogg
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump
    activeIfWorn: true
  - type: ClothingGrantComponent # Goobstation - Make sure the CE doesn't get cooked by supermatter
    component:
    - type: SupermatterImmune

- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHeadHelmetHardsuitDeathwatch
  categories: [ HideSpawnMenu ]
  name: шлем брони караула смерти
  description: Черный шлем с красной полосой капрала.
  components:
  - type: Sprite
    sprite: _Horizon/Clothing/Head/Hardsuits/deathwatch.rsi
  - type: Clothing
    sprite: _Horizon/Clothing/Head/Hardsuits/deathwatch.rsi
  - type: PointLight
    color: "#ffed7f"
  - type: PressureProtection
    highPressureMultiplier: 0.45
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
        Cold: 0.8
        Shock: 0.8
        Radiation: 0.5
  - type: FireProtection
    reduction: 0.5
  - type: UseDelay
    delay: 4
  - type: PNV

# EVA suit with a built-in mini jetpack, holding half the gas of a JetpackMiniFilled.
- type: entity
  parent: ClothingOuterHardsuitEVA
  id: ClothingOuterHardsuitJetpackEVA
  name: EVA suit with jetpack
  description: A lightweight space suit with a built-in emergency jetpack.
  components:
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    outputPressure: 42.6
    air:
      # ~2 minutes of thrust, half of JetpackMiniFilled
      volume: 0.75
      temperature: 293.15
      moles:
        - 0.153853429 # oxygen
        - 0.153853429 # nitrogen
  - type: Jetpack
    moleUsage: 0.00085
